name: PR Review
on: [pull_request]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "B3: Shellcheck"
        run: |
          sudo apt-get install -y shellcheck > /dev/null 2>&1
          for f in bin/*; do
            [ -f "$f" ] && shellcheck "$f"
          done

      - name: "B1: No secret exfiltration patterns"
        run: |
          patterns='(>>?\s|tee\s|mktemp|curl\s|wget\s|nc\s|ncat\s)'
          if git diff origin/main --unified=0 -- 'bin/*' | grep -P "$patterns"; then
            echo "::error::B1 FAIL — Potential secret exfiltration pattern detected in diff"
            exit 1
          fi
          value_patterns='(echo.*\$\{?value|printf.*\$\{?value|>\s.*\$\{?value)'
          if git diff origin/main --unified=0 -- 'bin/*' | grep -P "$value_patterns"; then
            echo "::error::B1 FAIL — Possible secret value written to output or file"
            exit 1
          fi

      - name: "B2: TTY preservation (exec is last happy-path line)"
        run: |
          for f in bin/*; do
            [ -f "$f" ] || continue
            last=$(grep -v '^\s*#' "$f" | grep -v '^\s*$' | tail -1)
            if echo "$last" | grep -q 'exec "\$@"'; then
              echo "B2 PASS — $f ends with exec"
            else
              echo "::error::B2 FAIL — $f last line is '$last', expected 'exec \"\$@\"'"
              exit 1
            fi
          done

      - name: "F1: Complexity flag"
        run: |
          for f in bin/*; do
            [ -f "$f" ] || continue
            current=$(wc -l < "$f")
            added=$(git diff origin/main --numstat -- "$f" | awk '{print $1}' || echo 0)
            [ -z "$added" ] && added=0
            if [ "$added" -gt 0 ] && [ "$added" -gt "$((current / 2))" ]; then
              echo "::warning::F1 FLAG — $f: $added lines added to a $current-line script. Review for proportionality."
            else
              echo "F1 OK — $f: $added lines added to $current-line script"
            fi
          done

      - name: "F2: New external commands"
        run: |
          allowlist='(bash|sh|op|git|grep|sed|cut|tr|echo|printf|env|exec|wc|read|test|exit|shift|getopts|getopt|local|return|source|true|false|set|unset|export|eval|cat|head|tail|sort|awk|tput|mkdir|chmod|cp|ln|rm|ls|diff|basename|dirname|realpath|readlink|date|sleep|wait|kill|trap|ulimit|\[|\[\[)'
          new_commands=$(git diff origin/main --unified=0 -- 'bin/*' | grep '^\+' | grep -v '^\+\+\+' | grep -v '^\+\s*#' | grep -oP '\b\w+\b' | sort -u | grep -vP "^$allowlist$" | grep -vP '^[A-Z_]+$' | grep -vP '^(if|then|else|elif|fi|for|do|done|while|until|case|esac|in|function)$' || true)
          if [ -n "$new_commands" ]; then
            echo "::warning::F2 FLAG — New commands detected in diff (review for necessity): $new_commands"
          else
            echo "F2 OK — No new external commands detected"
          fi
